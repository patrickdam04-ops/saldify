  <style>
    .redirect-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .redirect-robot {
      width: 120px;
      animation: float 3s ease-in-out infinite;
      margin-bottom: 36px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .redirect-title {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      color: var(--text);
      margin-bottom: 14px;
      font-style: italic;
    }

    .redirect-sub {
      font-family: var(--font-sans);
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .redirect-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 28px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .redirect-fallback {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--subtle);
      transition: color 0.2s ease;
    }

    .redirect-fallback:hover {
      color: var(--amber);
    }
  </style>
</head>
